<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Commodification Lens | MBC Theory</title>
  <meta name="description" content="An analytical instrument for applying Migrant Body Commodification theory to immigration enforcement operations.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Source+Serif+4:ital,wght@0,300;0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0d0c0b; }
    @keyframes loadSlide { 0%{transform:translateX(-100%)} 50%{transform:translateX(0%)} 100%{transform:translateX(100%)} }
    @keyframes fadeUp { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
    select option { background: #1a1918; color: #e0dbd4; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useRef, useEffect } = React;

    const BASE_SYSTEM_PROMPT = `You are a rigorous analytical instrument applying the theoretical framework of Migrant Body Commodification (MBC) as developed by Jon Nealon. Your task is to analyze texts, news stories, documents, and events through this specific theoretical lens. You must be precise, scholarly, and grounded in the framework's specific concepts.

## THE THEORETICAL FRAMEWORK

**Core Thesis**: Contemporary U.S. immigration governance has evolved into a sophisticated system for extracting political, economic, diplomatic, and symbolic value from migrant bodies. Legal and policy mechanisms function as access keys to value that already exists in migrant bodies, rather than generating value themselves. The fundamental insight is: PRECARITY UNLOCKS VALUE.

**The Commodification Mechanism**: When migrants possess clear legal status (citizenship, definitive deportation, TPS), their extractable value is limited. It is the deliberate maintenance and engineering of legal uncertainty--deportability, pending cases, jurisdictional ambiguity--that transforms migrant bodies into renewable resources for multiple forms of value extraction. Revoking protections like TPS is a trap mechanism that manufactures vulnerability in people already present.

**Semantic Drift**: A critical enabling mechanism is the linguistic shift from "the immigration process" (migrants as subjects navigating a system) to "processing migrants" (migrants as objects being handled). This semantic drift transforms migrants from agents with legal standing into units requiring systematic handling, enabling them to be measured by volume, priced per unit, warehoused in "detention capacity," and exchanged as diplomatic currency.

## THREE MODELS OF COMMODIFICATION

**1. Systematic Commodification (exemplified by Governor Abbott's Texas bus operations)**
- Volume-based processing model
- Value extracted through sustained, industrial-scale throughput
- Migrants processed as calculable units (~$1,450 per migrant, 102,000+ transported)
- Strong correlation with electoral cycles rather than operational necessity
- Creates sustained political capital through continuous operations
- Functions like an industrial supply chain converting human detention into political output

**2. Spectacle Commodification (exemplified by Governor DeSantis's Martha's Vineyard flights)**
- Event-driven symbolic targeting model
- Value extracted through concentrated media impact and symbolic disruption
- Small numbers of carefully selected migrants (~50 people, ~$12,300 per migrant)
- Deliberately targets liberal-coded locations for maximum symbolic contrast
- Creates concentrated bursts of political value through media spectacle
- Operates as political theater where migrants serve as props in staged performances

**3. Transnational/Outsourced Commodification (exemplified by the CECOT arrangement)**
- Offshore warehousing through jurisdictional abandonment
- Value extracted through permanent removal from U.S. legal jurisdiction
- $6 million payment for annual detention capacity lease to El Salvador
- Simultaneous extraction across multiple value dimensions: diplomatic, institutional precedent, template replication, symbolic
- Manufactured jurisdictional confusion where no single legal system provides protection
- Migrants converted into diplomatic currency (the prisoner exchange with Venezuela)
- Most intensive form: complete removal from domestic legal oversight while maintaining political utility

## VALUE EXTRACTION TYPOLOGY

When analyzing any text, identify which of these value streams are present:

- **Political Capital Value**: Does the action generate electoral advantage, base mobilization, or partisan positioning?
- **Symbolic/Media Value**: Does the action produce images, narratives, or spectacles that circulate for political messaging?
- **Economic Value**: Are contractors, private companies, or state budgets benefiting from migrant processing?
- **Diplomatic Value**: Are migrants being used as leverage in international negotiations or relationships?
- **Institutional Precedent Value**: Does the action establish new legal or procedural norms that expand executive/state power?
- **Template Replication Value**: Does the action create a replicable model other actors can adopt?
- **Deterrence Theater Value**: Is the claimed "deterrent effect" actually functioning as performative messaging rather than genuine policy?

## KEY ANALYTICAL INDICATORS

Look for these patterns that signal commodification logic:

1. **Cost-to-function disparity**: When enforcement costs vastly exceed what efficient alternatives would require, the excess cost purchases political/symbolic value, not enforcement outcomes
2. **Electoral cycle correlation**: When operations intensify around elections rather than in response to actual migration patterns
3. **Jurisdictional manipulation**: When legal authority is deliberately fragmented or obscured to prevent accountability
4. **Dehumanizing language**: When migrants are described in terms of volume, flow, processing, capacity, throughput
5. **Selective targeting**: When specific migrant populations are chosen for symbolic rather than operational reasons
6. **Legal precarity engineering**: When policies deliberately create or maintain uncertainty rather than resolving legal status
7. **Spectacle architecture**: When operations are designed to produce media content rather than enforcement outcomes
8. **Contractor enrichment**: When private companies profit disproportionately from migrant processing infrastructure

## HOW TO STRUCTURE YOUR ANALYSIS

For any input text, provide:

1. **Summary**: Brief description of what the text describes
2. **Commodification Model Identification**: Which of the three models (systematic, spectacle, transnational) does this most resemble? Could it be a hybrid? Could it represent an emerging new model?
3. **Value Streams Detected**: Which specific forms of value extraction are operating?
4. **Precarity Mechanisms**: How is legal uncertainty being engineered or maintained?
5. **Semantic Analysis**: What language patterns reveal commodification logic? Is there evidence of the "processing" semantic drift?
6. **Key Actors and Their Extraction Roles**: Who benefits and how?
7. **Comparative Connections**: How does this relate to the established case studies (Abbott buses, DeSantis flights, CECOT)?
8. **Theoretical Implications**: What does this case reveal or extend about MBC theory?

IMPORTANT: At the very end of your analysis, after all sections, include a line in exactly this format:
SUGGESTED_TITLE: [A concise, descriptive case title for this analysis, e.g., "Italy-Albania Offshore Detention Agreement" or "Texas SB4 Self-Deportation Provisions"]

## CRITICAL INSTRUCTIONS

- Be rigorous and specific. Cite particular passages from the input text that demonstrate commodification logic.
- Do not force the framework where it does not apply. If a text describes legitimate enforcement with no commodification indicators, say so.
- Distinguish between incidental costs of enforcement and deliberate value extraction. Not all immigration policy is commodification.
- Use precise theoretical language from the framework (precarity, value extraction, semantic drift, jurisdictional abandonment, etc.)
- When the evidence is ambiguous, acknowledge uncertainty and explain what additional information would clarify the analysis.
- Write in an accessible but scholarly register. This tool is meant to help researchers, journalists, advocates, and students apply the framework.
- Never reproduce large portions of the input text. Analyze it; do not summarize it.
- Format your response with clear section headers using ## for main sections and ### for subsections.
- Always include the SUGGESTED_TITLE line at the very end of your response.`;

    const CASE_LIBRARY_KEY = "mbc-case-library-v2";
    const MAX_LIBRARY_CONTEXT = 3000;

    // Use relative URL for the proxy - works on Vercel
    const API_ENDPOINT = "/api/analyze";

    function loadCaseLibrary() {
      try {
        const stored = localStorage.getItem(CASE_LIBRARY_KEY);
        return stored ? JSON.parse(stored) : [];
      } catch {
        return [];
      }
    }

    function saveCaseLibrary(library) {
      try {
        localStorage.setItem(CASE_LIBRARY_KEY, JSON.stringify(library));
        return true;
      } catch (e) {
        console.error("Storage error:", e);
        return false;
      }
    }

    function buildLibraryContext(cases) {
      if (!cases.length) return "";
      let context = `\n\n## CASE LIBRARY: PRIOR ANALYSES\n\nThe following cases have been previously analyzed through the MBC framework. Reference them when relevant to strengthen comparative analysis and identify emerging patterns.\n\n`;
      let charCount = context.length;
      for (const c of cases.slice(-15)) {
        const entry = `### ${c.title} (${c.date})\n- **Model**: ${c.model}\n- **Value Streams**: ${c.valueStreams}\n- **Key Finding**: ${c.keyFinding}\n\n`;
        if (charCount + entry.length > MAX_LIBRARY_CONTEXT) break;
        context += entry;
        charCount += entry.length;
      }
      context += `Total cases in library: ${cases.length}. Use these prior analyses to identify patterns across cases, note when new submissions resemble or diverge from prior cases, and flag when evidence suggests the framework should be extended or refined.\n`;
      return context;
    }

    function isUrl(text) {
      const trimmed = text.trim();
      return /^https?:\/\//i.test(trimmed) || /^www\./i.test(trimmed);
    }

    function extractSuggestedTitle(analysisText) {
      const match = analysisText.match(/SUGGESTED_TITLE:\s*(.+)/);
      return match ? match[1].trim() : "";
    }

    function stripTitleLine(analysisText) {
      return analysisText.replace(/\n?SUGGESTED_TITLE:\s*.+$/, "").trim();
    }

    function readFileAsText(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(new Error("Failed to read file."));
        reader.readAsText(file);
      });
    }

    function MBCLens() {
      const [textInput, setTextInput] = useState("");
      const [analysis, setAnalysis] = useState("");
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState("");
      const [caseLibrary, setCaseLibrary] = useState([]);
      const [showLibrary, setShowLibrary] = useState(false);
      const [savingCase, setSavingCase] = useState(false);
      const [saveForm, setSaveForm] = useState({ title: "", model: "", valueStreams: "", keyFinding: "" });
      const [saveStatus, setSaveStatus] = useState("");
      const [lastAnalysisInput, setLastAnalysisInput] = useState("");
      const [uploadedFileName, setUploadedFileName] = useState("");
      const [expandedCases, setExpandedCases] = useState({});
      const outputRef = useRef(null);
      const libraryRef = useRef(null);
      const fileInputRef = useRef(null);

      useEffect(() => {
        setCaseLibrary(loadCaseLibrary());
      }, []);

      useEffect(() => {
        if (analysis && outputRef.current) {
          outputRef.current.scrollIntoView({ behavior: "smooth", block: "start" });
        }
      }, [analysis]);

      const handleFileUpload = async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const allowedTypes = ["text/plain", "text/html", "text/markdown", "text/csv", "application/json"];
        const allowedExtensions = [".txt", ".md", ".html", ".htm", ".csv", ".json", ".rtf"];
        const ext = "." + file.name.split(".").pop().toLowerCase();
        if (!allowedTypes.includes(file.type) && !allowedExtensions.includes(ext)) {
          setError("Unsupported file type. Please upload a text-based document (.txt, .md, .html, .csv, .json).");
          return;
        }
        try {
          const text = await readFileAsText(file);
          if (!text.trim()) {
            setError("The uploaded file appears to be empty.");
            return;
          }
          setTextInput(text);
          setUploadedFileName(file.name);
          setError("");
        } catch (err) {
          setError("Failed to read the uploaded file.");
        }
        if (fileInputRef.current) fileInputRef.current.value = "";
      };

      const fetchUrl = async (url) => {
        let cleanUrl = url.trim();
        if (/^www\./i.test(cleanUrl)) cleanUrl = "https://" + cleanUrl;

        const res = await fetch(API_ENDPOINT, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            max_tokens: 1000,
            tools: [{ type: "web_search_20250305", name: "web_search" }],
            messages: [{ role: "user", content: `Retrieve and return the full text content from this URL: ${cleanUrl}. Return ONLY the article text, no commentary.` }],
          }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error?.message || "Failed to fetch URL");
        const text = data.content?.filter((b) => b.type === "text").map((b) => b.text).join("\n") || "";
        if (!text) throw new Error("Could not retrieve content from that URL.");
        return text;
      };

      const runAnalysis = async (content) => {
        const libraryContext = buildLibraryContext(caseLibrary);
        const fullSystemPrompt = BASE_SYSTEM_PROMPT + libraryContext;
        const caseCount = caseLibrary.length;

        const res = await fetch(API_ENDPOINT, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            max_tokens: 4000,
            system: fullSystemPrompt,
            messages: [{ role: "user", content: `Analyze the following text through the Migrant Body Commodification theoretical lens. Apply the full analytical framework.${caseCount > 0 ? ` Reference relevant prior cases from the case library where applicable.` : ""}\n\n---\n\n${content.slice(0, 25000)}` }],
          }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error?.message || "Analysis failed");
        const text = data.content?.filter((b) => b.type === "text").map((b) => b.text).join("\n");
        if (!text) throw new Error("No analysis returned. Please try again.");
        return text;
      };

      const handleSubmit = async () => {
        const input = textInput.trim();
        if (!input) {
          setError("Please enter text, a URL, or upload a document to analyze.");
          return;
        }
        setError("");
        setAnalysis("");
        setLoading(true);
        setSavingCase(false);
        setSaveStatus("");

        try {
          let content;
          if (isUrl(input)) {
            content = await fetchUrl(input);
          } else {
            content = input;
          }
          setLastAnalysisInput(content.slice(0, 200));
          const rawResult = await runAnalysis(content);
          const suggestedTitle = extractSuggestedTitle(rawResult);
          const cleanResult = stripTitleLine(rawResult);
          setAnalysis(cleanResult);
          setSaveForm((prev) => ({ ...prev, title: suggestedTitle }));
        } catch (err) {
          setError(err.message || "An error occurred during analysis.");
        } finally {
          setLoading(false);
          setUploadedFileName("");
        }
      };

      const handleSaveCase = () => {
        if (!saveForm.title.trim()) { setSaveStatus("Please enter a case title."); return; }
        if (!saveForm.model) { setSaveStatus("Please select a commodification model."); return; }
        if (!saveForm.keyFinding.trim()) { setSaveStatus("Please enter a key finding."); return; }

        const newCase = {
          title: saveForm.title.trim(),
          model: saveForm.model,
          valueStreams: saveForm.valueStreams.trim(),
          keyFinding: saveForm.keyFinding.trim(),
          fullAnalysis: analysis,
          id: Date.now().toString(),
          date: new Date().toISOString().split("T")[0],
          inputPreview: lastAnalysisInput,
        };

        const updated = [...caseLibrary, newCase];
        const success = saveCaseLibrary(updated);

        if (success) {
          setCaseLibrary(updated);
          setSavingCase(false);
          setSaveForm({ title: "", model: "", valueStreams: "", keyFinding: "" });
          setSaveStatus("");
          setShowLibrary(true);
          if (libraryRef.current) {
            setTimeout(() => libraryRef.current.scrollIntoView({ behavior: "smooth", block: "start" }), 100);
          }
        } else {
          setSaveStatus("Failed to save. Storage may not be available.");
        }
      };

      const handleRemoveCase = (id) => {
        const updated = caseLibrary.filter((c) => c.id !== id);
        setCaseLibrary(updated);
        saveCaseLibrary(updated);
      };

      const handleClearLibrary = () => {
        setCaseLibrary([]);
        saveCaseLibrary([]);
      };

      const toggleCaseExpanded = (id) => {
        setExpandedCases(prev => ({ ...prev, [id]: !prev[id] }));
      };

      const phases = [
        "Ingesting source material...",
        "Identifying commodification indicators...",
        "Mapping value extraction streams...",
        "Cross-referencing case library...",
        "Analyzing precarity mechanisms...",
        "Generating theoretical assessment...",
      ];
      const [phaseIdx, setPhaseIdx] = useState(0);
      useEffect(() => {
        if (!loading) { setPhaseIdx(0); return; }
        const interval = setInterval(() => setPhaseIdx((p) => (p + 1) % phases.length), 3200);
        return () => clearInterval(interval);
      }, [loading]);

      const caseCount = caseLibrary.length;

      const renderAnalysis = (text) => {
        const lines = text.split("\n");
        const elements = [];
        let i = 0;
        while (i < lines.length) {
          const line = lines[i];
          if (line.startsWith("## ")) {
            elements.push(<h2 key={i} style={styles.sectionHead}>{line.replace(/^##\s*/, "").replace(/\*\*/g, "")}</h2>);
          } else if (line.startsWith("### ")) {
            elements.push(<h3 key={i} style={styles.subHead}>{line.replace(/^###\s*/, "").replace(/\*\*/g, "")}</h3>);
          } else if (line.startsWith("- ") || line.startsWith("* ")) {
            const items = [];
            while (i < lines.length && (lines[i].startsWith("- ") || lines[i].startsWith("* "))) {
              items.push(lines[i].replace(/^[-*]\s*/, ""));
              i++;
            }
            elements.push(
              <ul key={`ul-${i}`} style={styles.list}>
                {items.map((item, j) => <li key={j} style={styles.listItem}>{renderInline(item)}</li>)}
              </ul>
            );
            continue;
          } else if (line.trim() === "") {
            // skip blank
          } else {
            elements.push(<p key={i} style={styles.para}>{renderInline(line)}</p>);
          }
          i++;
        }
        return elements;
      };

      const renderInline = (text) => {
        const parts = [];
        const regex = /\*\*(.+?)\*\*/g;
        let last = 0, match;
        while ((match = regex.exec(text)) !== null) {
          if (match.index > last) parts.push(text.slice(last, match.index));
          parts.push(<strong key={match.index} style={{ color: "#c4403a", fontWeight: 700 }}>{match[1]}</strong>);
          last = regex.lastIndex;
        }
        if (last < text.length) parts.push(text.slice(last));
        return parts.length > 0 ? parts : text;
      };

      const handleKeyDown = (e) => {
        if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) {
          e.preventDefault();
          handleSubmit();
        }
      };

      return (
        <div style={styles.root}>
          <div style={styles.bgTexture} />
          <div style={styles.container}>

            {/* Header */}
            <header style={styles.header}>
              <div style={styles.rule} />
              <h1 style={styles.title}><span style={styles.titleLight}>The</span> Commodification Lens</h1>
              <p style={styles.subtitle}>An Analytical Instrument for Migrant Body Commodification Theory</p>
              <p style={styles.attribution}>Theoretical framework by Jon Nealon</p>
              <div style={styles.rule} />
              <button
                onClick={() => { /* Placeholder: will link to PDF when published */ }}
                style={styles.paperBtn}
                title="Paper forthcoming in Citizenship Studies"
              >
                <span style={styles.paperIcon}>&#x25A0;</span> Read the Paper
              </button>
            </header>

            {/* Description */}
            <section style={styles.descSection}>
              <p style={styles.descText}>
                This tool applies the Migrant Body Commodification (MBC) theoretical
                framework to analyze how immigration enforcement operations extract
                political, economic, diplomatic, and symbolic value from migrant
                bodies through engineered legal precarity.
              </p>
              <div style={styles.conceptRow}>
                {[
                  { n: "I", l: "Systematic", d: "Volume-based industrial processing" },
                  { n: "II", l: "Spectacle", d: "Event-driven symbolic targeting" },
                  { n: "III", l: "Transnational", d: "Offshore jurisdictional abandonment" },
                ].map((c) => (
                  <div key={c.n} style={styles.conceptCard}>
                    <div style={styles.conceptIcon}>{c.n}</div>
                    <div style={styles.conceptLabel}>{c.l}</div>
                    <div style={styles.conceptDesc}>{c.d}</div>
                  </div>
                ))}
              </div>
            </section>

            {/* Input */}
            <section style={styles.inputSection}>
              <label style={styles.inputLabel}>Paste text, enter a URL, or upload a document</label>
              <textarea
                value={textInput}
                onChange={(e) => { setTextInput(e.target.value); setUploadedFileName(""); }}
                onKeyDown={handleKeyDown}
                placeholder={"Paste a news article, policy document, executive order, press release, or enter a URL...\n\nThe tool will auto-detect URLs and fetch the content."}
                style={styles.textarea}
                rows={10}
              />
              <div style={styles.inputFooter}>
                {isUrl(textInput.trim()) && (
                  <div style={styles.urlDetected}>
                    URL detected. Content will be fetched automatically.
                  </div>
                )}
                {uploadedFileName && (
                  <div style={styles.fileLoaded}>
                    Loaded: {uploadedFileName}
                  </div>
                )}
                <div style={styles.uploadRow}>
                  <input
                    ref={fileInputRef}
                    type="file"
                    accept=".txt,.md,.html,.htm,.csv,.json,.rtf"
                    onChange={handleFileUpload}
                    style={{ display: "none" }}
                  />
                  <button
                    onClick={() => fileInputRef.current?.click()}
                    style={styles.uploadBtn}
                  >
                    Upload document
                  </button>
                  <span style={styles.uploadHint}>.txt, .md, .html, .csv, .json</span>
                </div>
              </div>
              <button
                onClick={handleSubmit}
                disabled={loading}
                style={{ ...styles.submitBtn, ...(loading ? styles.submitDisabled : {}) }}
              >
                {loading ? "Analyzing..." : "Apply the Commodification Lens"}
              </button>
              {caseCount > 0 && !loading && (
                <p style={styles.libraryIndicator}>
                  Informed by {caseCount} case{caseCount !== 1 ? "s" : ""} in the library
                </p>
              )}
              {error && <p style={styles.error}>{error}</p>}
            </section>

            {/* Loading */}
            {loading && (
              <section style={styles.loadingSection}>
                <div style={styles.loadingBar}><div style={styles.loadingFill} /></div>
                <p style={styles.loadingText}>{phases[phaseIdx]}</p>
                <p style={styles.loadingNote}>This analysis typically takes 1-3 minutes.</p>
              </section>
            )}

            {/* Output */}
            {analysis && (
              <section ref={outputRef} style={styles.outputSection}>
                <div style={styles.outputHeader}>
                  <div style={styles.rule} />
                  <h2 style={styles.outputTitle}>Theoretical Analysis</h2>
                  <p style={styles.outputSubtitle}>
                    Migrant Body Commodification Framework Applied
                    {caseCount > 0 && ` · Informed by ${caseCount} prior case${caseCount !== 1 ? "s" : ""}`}
                  </p>
                  <div style={styles.rule} />
                </div>
                <div style={styles.outputBody}>{renderAnalysis(analysis)}</div>

                {/* Save to Library */}
                <div style={styles.saveSection}>
                  {!savingCase ? (
                    <button onClick={() => { setSavingCase(true); setSaveStatus(""); }} style={styles.saveToggle}>
                      + Save this analysis to the Case Library
                    </button>
                  ) : (
                    <div style={styles.saveForm}>
                      <h4 style={styles.saveFormTitle}>Save to Case Library</h4>
                      <p style={styles.saveFormDesc}>
                        This case will inform future analyses, enriching the comparative framework.
                      </p>
                      <input
                        type="text"
                        placeholder="Case title *"
                        value={saveForm.title}
                        onChange={(e) => setSaveForm({ ...saveForm, title: e.target.value })}
                        style={styles.saveInput}
                      />
                      <div style={styles.selectWrapper}>
                        <select
                          value={saveForm.model}
                          onChange={(e) => setSaveForm({ ...saveForm, model: e.target.value })}
                          style={styles.saveSelect}
                        >
                          <option value="">Select primary commodification model *</option>
                          <option value="Systematic">Systematic</option>
                          <option value="Spectacle">Spectacle</option>
                          <option value="Transnational">Transnational</option>
                          <option value="Hybrid: Systematic-Spectacle">Hybrid: Systematic-Spectacle</option>
                          <option value="Hybrid: Spectacle-Transnational">Hybrid: Spectacle-Transnational</option>
                          <option value="Hybrid: Systematic-Transnational">Hybrid: Systematic-Transnational</option>
                          <option value="Emerging model">Emerging model</option>
                        </select>
                      </div>
                      <input
                        type="text"
                        placeholder="Value streams (e.g., 'Political, Symbolic, Economic')"
                        value={saveForm.valueStreams}
                        onChange={(e) => setSaveForm({ ...saveForm, valueStreams: e.target.value })}
                        style={styles.saveInput}
                      />
                      <textarea
                        placeholder="Key finding: What does this case reveal about MBC theory? (1-2 sentences) *"
                        value={saveForm.keyFinding}
                        onChange={(e) => setSaveForm({ ...saveForm, keyFinding: e.target.value })}
                        style={styles.saveTextarea}
                        rows={3}
                      />
                      {saveStatus && <p style={styles.saveError}>{saveStatus}</p>}
                      <div style={styles.saveActions}>
                        <button onClick={handleSaveCase} style={styles.saveConfirm}>Save to Library</button>
                        <button onClick={() => { setSavingCase(false); setSaveStatus(""); }} style={styles.saveCancel}>Cancel</button>
                      </div>
                    </div>
                  )}
                </div>

                <div style={styles.outputFooter}>
                  <p style={styles.footerNote}>
                    This analysis applies the Migrant Body Commodification framework
                    developed by Jon Nealon. The framework identifies three models
                    of commodification (systematic, spectacle, and transnational) and
                    examines how engineered legal precarity enables value extraction
                    from migrant bodies across political, economic, diplomatic, and
                    symbolic dimensions.
                  </p>
                </div>
              </section>
            )}

            {/* Case Library at Bottom */}
            <section ref={libraryRef} style={styles.librarySection}>
              <div style={styles.libraryBar} onClick={() => setShowLibrary(!showLibrary)}>
                <h3 style={styles.libraryBarTitle}>Case Library</h3>
                <div style={styles.libraryBarRight}>
                  <span style={styles.libBadge}>{caseCount}</span>
                  <span style={styles.libraryBarToggle}>{showLibrary ? "Collapse" : "Expand"}</span>
                </div>
              </div>

              {showLibrary && (
                <div style={styles.libraryPanel}>
                  <p style={styles.librarySubtitle}>
                    Saved analyses feed back into the system prompt, expanding the
                    theoretical framework with each new case. The more cases you
                    save, the richer the comparative analysis becomes.
                  </p>
                  {caseLibrary.length === 0 ? (
                    <p style={styles.libraryEmpty}>
                      No cases saved yet. Run an analysis and save it to begin building the library.
                    </p>
                  ) : (
                    <div>
                      {caseLibrary.map((c) => (
                        <div key={c.id} style={styles.caseCard}>
                          <div 
                            style={styles.caseHeader} 
                            onClick={() => c.fullAnalysis && toggleCaseExpanded(c.id)}
                          >
                            <div style={styles.caseTop}>
                              <strong style={styles.caseTitle}>{c.title}</strong>
                              <span style={styles.caseDate}>{c.date}</span>
                            </div>
                            <div style={styles.caseMeta}>
                              <span style={styles.caseModel}>{c.model}</span>
                              {c.valueStreams && <span style={styles.caseStreams}>{c.valueStreams}</span>}
                            </div>
                            <p style={styles.caseFinding}>{c.keyFinding}</p>
                            {c.fullAnalysis && (
                              <span style={styles.caseExpandHint}>
                                {expandedCases[c.id] ? "▼ Click to collapse" : "▶ Click to read full analysis"}
                              </span>
                            )}
                          </div>
                          {expandedCases[c.id] && c.fullAnalysis && (
                            <div style={styles.caseFullAnalysis}>
                              <div style={styles.rule} />
                              {renderAnalysis(c.fullAnalysis)}
                            </div>
                          )}
                          <button onClick={(e) => { e.stopPropagation(); handleRemoveCase(c.id); }} style={styles.caseRemove}>Remove</button>
                        </div>
                      ))}
                      <button onClick={handleClearLibrary} style={styles.clearLib}>Clear entire library</button>
                    </div>
                  )}
                </div>
              )}
            </section>

            {/* Footer */}
            <footer style={styles.footer}>
              <div style={styles.rule} />
              <p style={styles.footerText}>Migrant Body Commodification Theory — Jon Nealon</p>
              <p style={styles.footerSmall}>Framework forthcoming in <em>Citizenship Studies</em></p>
            </footer>
          </div>
        </div>
      );
